appId: com.md2pdf.app
productName: MD2PDF
directories:
  output: release
linux:
  target:
  - target: AppImage
    arch:
    - x64
  category: Office
  icon: assets/icons
  synopsis: "Edytor Markdown z podglądem, Mermaid i eksportem PDF"
files:
- dist/**/*
- assets/**/*
- src/renderer/index.html
- node_modules/**/*
- "!node_modules/.cache"
- "!**/*.ts"
- "!**/*.map"
asar: true
# @resvg/resvg-js ships prebuilt per-platform native binaries (.node files).
# Native addons cannot be loaded from inside an asar archive — they must be
# unpacked to the filesystem. The glob below covers all platform-specific
# @resvg scoped packages (e.g. @resvg/resvg-js-linux-x64-gnu).
asarUnpack:
- "node_modules/@resvg/**"
- "node_modules/@laneflow/renderer/**"
