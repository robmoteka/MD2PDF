<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>MD2PDF</title>
  <link rel="stylesheet" href="../../assets/styles/app.css">
  <link rel="stylesheet" href="../../assets/styles/preview.css">
  <link id="theme-link" rel="stylesheet" href="../../assets/styles/themes/light.css">
</head>
<body>
  <div id="toolbar">
    <span id="file-name">Nowy dokument</span>
    <span id="modified-indicator" class="hidden">●</span>
    <div id="toolbar-actions">
      <button id="btn-open" title="Otwórz (Ctrl+O)">📂 Otwórz</button>
      <button id="btn-save" title="Zapisz (Ctrl+S)">💾 Zapisz</button>
      <button id="btn-export" title="Eksport PDF (Ctrl+E)">📄 PDF</button>
      <button id="btn-export-all" title="Eksportuj wszystkie otwarte pliki do PDF">📦 Eksportuj wszystkie</button>
      <button id="btn-page-break" title="Wstaw podział strony w miejscu kursora">&#x2015; Podział str.</button>
      <button id="btn-theme" title="Przełącz motyw (Ctrl+T)">🌓 Motyw</button>
    </div>
  </div>
  <div id="tab-bar">
    <div id="tab-list"></div>
    <button id="btn-new-tab" title="Nowa zakładka (Ctrl+N)">+</button>
  </div>
  <div id="main-container">
    <div id="editor-pane"></div>
    <div id="splitter"></div>
    <div id="preview-pane">
      <div id="preview-content"></div>
    </div>
  </div>
  <div id="status-bar">
    <span id="status-message">Gotowy</span>
    <span id="cursor-position">Ln 1, Col 1</span>
  </div>
  <dialog id="pdf-settings-dialog">
    <h3>Ustawienia eksportu PDF</h3>
    <div class="pdf-settings-section">
      <span class="pdf-settings-label">Format strony</span>
      <div class="pdf-settings-options">
        <label><input type="radio" name="pdf-page-size" value="A4" checked> A4</label>
        <label><input type="radio" name="pdf-page-size" value="A3"> A3</label>
      </div>
    </div>
    <div class="pdf-settings-section">
      <span class="pdf-settings-label">Orientacja</span>
      <div class="pdf-settings-options">
        <label><input type="radio" name="pdf-orientation" value="portrait" checked> Pionowa</label>
        <label><input type="radio" name="pdf-orientation" value="landscape"> Pozioma</label>
      </div>
    </div>
    <div class="pdf-settings-actions">
      <button id="pdf-settings-cancel">Anuluj</button>
      <button id="pdf-settings-confirm" class="primary">Eksportuj</button>
    </div>
  </dialog>
  <script src="../../dist/renderer/renderer.js"></script>
</body>
</html>
